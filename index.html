<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Navegación Sanatorio - WebAR</title>
    <!-- Cargar A-Frame y componentes de Realidad Aumentada -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #info-hud {
        position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
        z-index: 999; background: rgba(0, 85, 165, 0.9); color: white;
        padding: 10px 20px; border-radius: 10px; text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-size: 14px;
      }
    </style>
  </head>
  <body>

    <!-- Indicador superior en pantalla -->
    <div id="info-hud">
      <strong>Sanatorio - Navegación AR</strong><br>
      <span style="font-size: 12px; color: #00E5FF;">Apunta al piso del pasillo para iniciar</span>
    </div>

    <!-- Escena WebAR optimizada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

      <!-- ================= LÍNEAS DE COLORES EN EL PISO ================= -->
      
      <!-- Línea Roja: Acceso a Shockroom (6.5m) -->
      <a-entity position="0 0.01 -3.25" rotation="-90 0 0">
        <a-plane width="0.35" height="6.5" color="#D32F2F" opacity="0.85"></a-plane>
      </a-entity>

      <!-- Línea Celeste: Ruta hacia Tomografía (35m) -->
      <a-entity position="-0.8 0.01 -17.5" rotation="-90 0 0">
        <a-plane width="0.35" height="35" color="#0055A5" opacity="0.85"></a-plane>
      </a-entity>

      <!-- Línea Verde: Ruta hacia Farmacia (43.66m) -->
      <a-entity position="0 0.01 -21.8" rotation="-90 0 0">
        <a-plane width="0.35" height="43.66" color="#2E7D32" opacity="0.85"></a-plane>
      </a-entity>


      <!-- ================= CARTELES Y BALIZAS 3D DE LOS SERVICIOS ================= -->

      <!-- 1. Shockroom (6.5 m) -->
      <a-entity position="0 1.8 -6.5">
        <a-plane width="2.2" height="0.8" color="#D32F2F">
          <a-text value="SHOCKROOM\nUrgencias (6.5m)" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
        </a-plane>
      </a-entity>

      <!-- 2. Cámara Gamma (31.6 m)[cite: 1] -->
      <a-entity position="0 1.8 -31.6">
        <a-plane width="2.2" height="0.8" color="#7B1FA2">
          <a-text value="CAMARA GAMMA\n(31.6m)" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
        </a-plane>
      </a-entity>

      <!-- 3. Informática (32.0 m - Derecha)[cite: 1] -->
      <a-entity position="1.8 1.8 -32.0">
        <a-plane width="2.2" height="0.8" color="#0288D1">
          <a-text value="INFORMATICA\nDerecha (32m)" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
        </a-plane>
      </a-entity>

      <!-- 4. Tomografía (35.0 m - Izquierda)[cite: 1] -->
      <a-entity position="-1.8 1.8 -35.0">
        <a-plane width="2.4" height="0.9" color="#0055A5">
          <a-text value="TOMOGRAFIA\nIzquierda (35m)" align="center" color="#FFFFFF" scale="0.65 0.65 0.65"></a-text>
        </a-plane>
        <a-cone radius-bottom="0.25" radius-top="0" height="0.5" color="#00E5FF" position="0 0.7 0" animation="property: position; to: 0 1 0; dir: alternate; dur: 800; loop: true"></a-cone>
      </a-entity>

      <!-- 5. Secretaría de Hemodinamia (37.0 m)[cite: 1] -->
      <a-entity position="0 1.8 -37.0">
        <a-plane width="2.5" height="0.8" color="#C2185B">
          <a-text value="SEC. HEMODINAMIA\n(37m)" align="center" color="#FFFFFF" scale="0.55 0.55 0.55"></a-text>
        </a-plane>
      </a-entity>

      <!-- 6. Sala de Espera Terapia (38.5 m)[cite: 1] -->
      <a-entity position="0 1.8 -38.5">
        <a-plane width="2.5" height="0.8" color="#E65100">
          <a-text value="ESPERA TERAPIA\n(38.5m)" align="center" color="#FFFFFF" scale="0.55 0.55 0.55"></a-text>
        </a-plane>
      </a-entity>

      <!-- 7. Farmacia (43.66 m)[cite: 1] -->
      <a-entity position="0 1.8 -43.66">
        <a-plane width="2.2" height="0.8" color="#2E7D32">
          <a-text value="FARMACIA\n(43.66m)" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
        </a-plane>
      </a-entity>

      <!-- 8. Ingeniería (46.12 m - Derecha)[cite: 1] -->
      <a-entity position="1.8 1.8 -46.12">
        <a-plane width="2.2" height="0.8" color="#455A64">
          <a-text value="INGENIERIA\nDerecha (46.12m)" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
        </a-plane>
      </a-entity>

      <!-- Cámara del dispositivo -->
      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
