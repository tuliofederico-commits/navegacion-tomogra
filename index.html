<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>GPS Sanatorio - Realidad Aumentada</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #001f3f; }
      
      /* Pantalla Modal de Selección */
      #modal-seleccion {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 25, 50, 0.96); z-index: 10000;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; padding: 20px; box-sizing: border-box; text-align: center;
      }
      #contenedor-botones {
        width: 100%; max-width: 360px; max-height: 65vh; overflow-y: auto; margin-top: 10px;
      }
      .btn-destino {
        background: #00E5FF; color: #002b49; border: none; padding: 12px 16px;
        margin: 6px 0; border-radius: 10px; font-weight: bold; font-size: 15px;
        width: 100%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left;
      }
      .btn-destino:active { background: #00b8d4; }

      /* HUD Flotante */
      #hud-nav {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 999; background: rgba(0, 40, 80, 0.95); color: white;
        padding: 12px 18px; border-radius: 14px; text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.6); width: 90%; max-width: 400px; display: none;
      }
      .btn-ctrl {
        background: #00E5FF; color: #002b49; border: none; padding: 8px 12px;
        border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; margin: 3px;
      }
    </style>
  </head>
  <body>

    <!-- MODAL DE SELECCIÓN DE DESTINO -->
    <div id="modal-seleccion">
      <h2 style="margin-bottom: 5px;">Sanatorio - GPS AR</h2>
      <p style="color: #00E5FF; margin-top: 0;">¿A qué servicio te diriges?</p>
      <div id="contenedor-botones">Cargando servicios...</div>
    </div>

    <!-- HUD DE NAVEGACIÓN -->
    <div id="hud-nav">
      <strong id="txt-destino-titulo" style="font-size: 16px; color: #00E5FF;">Guía Activa</strong><br>
      <span id="txt-distancia" style="font-size: 14px;">Distancia: 0.0 m / 50m</span>
      <div style="margin-top: 8px;">
        <button class="btn-ctrl" onclick="mover(-3)">◀ -3m</button>
        <button class="btn-ctrl" onclick="mover(3)">+3m ▶</button>
        <button class="btn-ctrl" style="background: #FF5252; color: #FFF;" onclick="location.reload()">Cambiar Destino</button>
      </div>
    </div>

    <!-- ESCENA WEBAR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity id="contenedor-linea-piso" position="0 0.01 0" rotation="-90 0 0"></a-entity>
      <a-entity id="contenedor-cartel-destino" position="0 1.8 0"></a-entity>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      let datosServicios = [];
      let distanciaActual = 0;
      let metaDistancia = 0;
      let metaX = 0;

      // Cargar base de datos dinámicamente
      fetch('servicios.json')
        .then(res => res.json())
        .then(data => {
          datosServicios = data.servicios;
          renderizarBotones();
        })
        .catch(err => {
          console.error("Error al cargar servicios.json", err);
          document.getElementById('contenedor-botones').innerText = "Error cargando la lista de servicios.";
        });

      function renderizarBotones() {
        let cont = document.getElementById('contenedor-botones');
        cont.innerHTML = "";
        datosServicios.forEach(s => {
          let btn = document.createElement('button');
          btn.className = 'btn-destino';
          let ubicacionText = s.posicion_lateral !== 'centro' ? ` (${s.posicion_lateral})` : '';
          btn.innerHTML = `${s.icono} ${s.nombre} - ${s.distancia_m}m${ubicacionText}`;
          btn.onclick = () => iniciarNavegacion(s);
          cont.appendChild(btn);
        });
      }

      function iniciarNavegacion(servicio) {
        metaDistancia = servicio.distancia_m;
        metaX = servicio.offset_x_m;

        document.getElementById('modal-seleccion').style.display = 'none';
        document.getElementById('hud-nav').style.display = 'block';
        document.getElementById('txt-destino-titulo').innerText = "Ruta: " + servicio.nombre.toUpperCase();

        // Línea trazada en el suelo
        let contenedorLinea = document.getElementById('contenedor-linea-piso');
        contenedorLinea.innerHTML = `
          <a-plane width="0.4" height="${metaDistancia}" color="${servicio.color}" opacity="0.85" position="${metaX/2} ${-metaDistancia/2} 0"></a-plane>
        `;

        // Cartel 3D de llegada
        let contenedorCartel = document.getElementById('contenedor-cartel-destino');
        contenedorCartel.setAttribute('position', `${metaX} 1.8 ${-metaDistancia}`);
        contenedorCartel.innerHTML = `
          <a-plane width="2.4" height="0.9" color="${servicio.color}">
            <a-text value="LLEGADA A:\n${servicio.nombre.toUpperCase()}" align="center" color="#FFFFFF" scale="0.65 0.65 0.65"></a-text>
          </a-plane>
          <a-cone radius-bottom="0.25" radius-top="0" height="0.5" color="#00E5FF" position="0 0.7 0" animation="property: position; to: 0 1 0; dir: alternate; dur: 800; loop: true"></a-cone>
        `;

        actualizarHUD();
      }

      function mover(cuantos) {
        distanciaActual = Math.min(50, Math.max(0, distanciaActual + cuantos));
        actualizarHUD();
      }

      function actualizarHUD() {
        let resta = (metaDistancia - distanciaActual).toFixed(1);
        if (resta <= 0) {
          document.getElementById('txt-distancia').innerText = "¡Has llegado a tu destino!";
        } else {
          document.getElementById('txt-distancia').innerText = "Faltan " + resta + " metros para llegar";
        }
      }
    </script>
  </body>
</html>
