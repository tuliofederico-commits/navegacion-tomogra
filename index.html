<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>GPS Sanatorio - Pasos Automáticos</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      
      /* Pantalla de Selección */
      #modal-seleccion {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 25, 50, 0.96); z-index: 10000;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; padding: 20px; box-sizing: border-box; text-align: center;
      }
      #contenedor-botones {
        width: 100%; max-width: 360px; max-height: 60vh; overflow-y: auto; margin-top: 10px;
      }
      .btn-destino {
        background: #00E5FF; color: #002b49; border: none; padding: 12px 16px;
        margin: 6px 0; border-radius: 10px; font-weight: bold; font-size: 15px;
        width: 100%; cursor: pointer; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .btn-destino:active { background: #00b8d4; }

      /* HUD Superior en vivo */
      #hud-nav {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 999; background: rgba(0, 50, 100, 0.95); color: white;
        padding: 12px 20px; border-radius: 14px; text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 400px; display: none;
      }
    </style>
  </head>
  <body>

    <!-- 1. MODAL DE SELECCIÓN DE DESTINO -->
    <div id="modal-seleccion">
      <h2>Sanatorio - GPS de Interiores</h2>
      <p style="color: #00E5FF; margin-top: 0;">Selecciona el servicio al que deseas ir:</p>
      <div id="contenedor-botones">Cargando servicios...</div>
    </div>

    <!-- 2. HUD SUPERIOR -->
    <div id="hud-nav">
      <strong id="txt-destino-titulo" style="font-size: 15px; color: #00E5FF;">Guía Activa</strong><br>
      <span id="txt-distancia" style="font-size: 14px;">Comienza a caminar...</span>
    </div>

    <!-- 3. ESCENA 3D -->
    <a-scene embedded>
      <a-light type="ambient" color="#FFF" intensity="1.2"></a-light>
      
      <!-- Línea proyectada en el piso -->
      <a-entity id="linea-piso" rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>

      <!-- Cartel flotante de destino -->
      <a-entity id="cartel-destino" position="0 1.8 0" visible="false"></a-entity>

      <!-- Cámara -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
      let datosServicios = [];
      let servicioActual = null;
      let distanciaRecorrida = 0;
      let ultimoPaso = 0;

      // Cargar base de datos JSON
      fetch('servicios.json')
        .then(res => res.json())
        .then(data => {
          datosServicios = data.servicios;
          let cont = document.getElementById('contenedor-botones');
          cont.innerHTML = "";
          datosServicios.forEach(s => {
            let btn = document.createElement('button');
            btn.className = 'btn-destino';
            let lateral = s.posicion_lateral !== 'centro' ? ` (${s.posicion_lateral})` : '';
            btn.innerHTML = `${s.icono} <strong>${s.nombre}</strong>${lateral} - ${s.distancia_m}m`;
            btn.onclick = () => iniciarGuiaYSensores(s);
            cont.appendChild(btn);
          });
        });

      function iniciarGuiaYSensores(servicio) {
        servicioActual = servicio;
        distanciaRecorrida = 0;

        // 1. ACTIVAR SENSORES AUTOMÁTICAMENTE USANDO EL TOQUE DEL BOTÓN
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(response => {
              if (response === 'granted') {
                window.addEventListener('devicemotion', detectarPasos);
              }
            }).catch(console.error);
        } else {
          window.addEventListener('devicemotion', detectarPasos);
        }

        // 2. CONFIGURAR INTERFAZ Y RUTA
        document.getElementById('modal-seleccion').style.display = 'none';
        document.getElementById('hud-nav').style.display = 'block';
        document.getElementById('txt-destino-titulo').innerText = "Ruta: " + servicio.nombre.toUpperCase();

        let metaX = servicio.offset_x_m || 0;
        let metaZ = -servicio.distancia_m;

        // Dibujar línea en el piso
        let lineaPiso = document.getElementById('linea-piso');
        lineaPiso.setAttribute('visible', true);
        lineaPiso.innerHTML = `
          <a-plane width="0.4" height="${servicio.distancia_m}" color="${servicio.color}" opacity="0.9" position="${metaX/2} ${servicio.distancia_m/2} 0"></a-plane>
        `;

        // Colocar cartel flotante en el destino
        let cartel = document.getElementById('cartel-destino');
        cartel.setAttribute('visible', true);
        cartel.setAttribute('position', `${metaX} 1.8 ${metaZ}`);
        cartel.innerHTML = `
          <a-plane width="2.6" height="1.0" color="${servicio.color}">
            <a-text value="${servicio.nombre.toUpperCase()}\nDestino Exacto" align="center" color="#FFFFFF" scale="0.6 0.6 0.6"></a-text>
          </a-plane>
          <a-cone radius-bottom="0.3" radius-top="0" height="0.6" color="#00E5FF" position="0 0.8 0" animation="property: position; to: 0 1.2 0; dir: alternate; dur: 800; loop: true"></a-cone>
        `;

        actualizarDistanciaUI();
      }

      // Algoritmo de detección de pasos mediante acelerómetro
      function detectarPasos(e) {
        if (!servicioActual) return;
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;

        let magnitud = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let ahora = Date.now();

        // Detectar un pico de aceleración al dar un paso (con filtro de tiempo de 350ms)
        if (magnitud > 11.5 && (ahora - ultimoPaso) > 350) {
          ultimoPaso = ahora;
          // Cada paso cuenta aproximadamente 0.75 metros
          distanciaRecorrida = Math.min(servicioActual.distancia_m, distanciaRecorrida + 0.75);
          actualizarDistanciaUI();
        }
      }

      function actualizarDistanciaUI() {
        let restante = servicioActual.distancia_m - distanciaRecorrida;
        let txt = document.getElementById('txt-distancia');
        
        if (restante <= 0.5) {
          txt.innerHTML = "¡Has llegado a <strong>" + servicioActual.nombre + "</strong>!";
          txt.style.color = "#00E5FF";
        } else {
          txt.innerHTML = "Faltan <strong>" + restante.toFixed(1) + " metros</strong>";
          txt.style.color = "#FFF";
        }
      }
    </script>
  </body>
</html>
