<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Navegación Tomografía - Sin Marcadores</title>

    <!-- Cargar A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Cargar AR.js con soporte para geolocalización o variantes sin marcador -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Interfaz superpuesta (HUD) para guiar al usuario en pantalla -->
    <div id="hud" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; background: rgba(0, 85, 165, 0.9); color: white; padding: 10px 20px; border-radius: 8px; font-family: sans-serif; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <strong>Servicio de Tomografía</strong><br>
      <span id="instruction" style="font-size: 14px;">Apunta al piso y camina derecho 15 metros</span>
    </div>

    <!-- Escena AR interactiva -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

      <!-- Contenedor que aparecerá flotando frente al usuario al avanzar -->
      <a-entity id="tomografia-punto" position="0 0 -4">
        
        <!-- Cartel flotante automático -->
        <a-plane position="0 1.5 0" rotation="0 0 0" width="2.2" height="0.9" color="#0055A5">
          <a-text value="LLEGISTE A:\nTOMOGRAFIA\nConsultorio 12" align="center" color="#FFFFFF" position="0 0 0.1" scale="0.7 0.7 0.7"></a-text>
        </a-plane>

        <!-- Indicador 3D animado -->
        <a-cone radius-bottom="0.3" radius-top="0" height="0.6" color="#00E5FF" position="0 0.4 0" animation="property: position; to: 0 0.7 0; dir: alternate; dur: 1000; loop: true"></a-cone>

      </a-entity>

      <!-- Cámara del dispositivo con control de sensores -->
      <a-entity camera></a-entity>
      
    </a-scene>

  </body>
</html>
