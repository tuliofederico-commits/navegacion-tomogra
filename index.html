<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prueba AR - Navegación Sanatorio</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(0,0,0,.75);
      color: white;
      font-size: 15px;
      line-height: 1.35;
      text-align: center;
    }

    #estado {
      margin-top: 6px;
      font-weight: bold;
    }

    #ayuda {
      position: fixed;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 10;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 14px;
      text-align: center;
    }

    #reset {
      display: none;
      position: fixed;
      right: 15px;
      bottom: 80px;
      z-index: 20;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="info">
  <strong>PRUEBA AR — NAVEGACIÓN</strong>
  <div id="estado">Preparando realidad aumentada...</div>
</div>

<div id="ayuda">
  Tocá el botón de AR. Luego apuntá al piso y tocá una superficie para colocar la flecha.
</div>

<button id="reset">Volver a colocar</button>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { ARButton } from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

let camera, scene, renderer;
let controller;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let flecha = null;

const estado = document.getElementById('estado');
const ayuda = document.getElementById('ayuda');
const reset = document.getElementById('reset');

/* -------------------------------------------------------
   ESCENA
------------------------------------------------------- */

init();
animate();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    20
  );

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  /* Luz */
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
  scene.add(light);

  /* Retícula: indica dónde se detectó el piso */
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.08, 0.12, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({
      color: 0x00ff88,
      transparent: true,
      opacity: 0.8
    })
  );

  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  /* Controlador de toque */
  controller = renderer.xr.getController(0);

  controller.addEventListener('select', colocarFlecha);

  scene.add(controller);

  /* Botón AR */
  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: {
      root: document.body
    }
  });

  arButton.style.bottom = '20px';
  arButton.style.left = '50%';
  arButton.style.transform = 'translateX(-50%)';
  arButton.style.width = '220px';
  arButton.style.height = '55px';
  arButton.style.fontSize = '18px';
  arButton.style.fontWeight = 'bold';
  arButton.style.borderRadius = '12px';

  document.body.appendChild(arButton);

  renderer.xr.addEventListener('sessionstart', () => {
    estado.textContent = 'AR iniciada. Buscando el piso...';
    ayuda.textContent =
      'Mové lentamente el teléfono y apuntá hacia el piso. Cuando aparezca el círculo verde, tocá la pantalla.';
  });

  renderer.xr.addEventListener('sessionend', () => {
    estado.textContent = 'AR finalizada.';
    ayuda.textContent = 'Podés volver a iniciar la prueba.';
    hitTestSourceRequested = false;
    hitTestSource = null;
  });

  reset.addEventListener('click', () => {
    if (flecha) {
      scene.remove(flecha);
      flecha = null;
    }

    reset.style.display = 'none';

    estado.textContent = 'Buscando nuevamente el piso...';
    ayuda.textContent =
      'Apuntá al piso. Cuando aparezca el círculo verde, tocá la pantalla.';
  });

  window.addEventListener('resize', onWindowResize);
}

/* -------------------------------------------------------
   CREAR FLECHA
------------------------------------------------------- */

function crearFlecha() {

  const grupo = new THREE.Group();

  /*
    Flecha simple orientada hacia adelante.
    Largo aproximado: 0,70 m.
  */

  const material = new THREE.MeshBasicMaterial({
    color: 0x00ff66,
    side: THREE.DoubleSide
  });

  const cuerpo = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.025, 0.48),
    material
  );

  cuerpo.position.z = -0.12;

  const punta = new THREE.Mesh(
    new THREE.ConeGeometry(0.16, 0.28, 4),
    material
  );

  punta.rotation.x = Math.PI / 2;
  punta.position.z = -0.42;

  grupo.add(cuerpo);
  grupo.add(punta);

  return grupo;
}

/* -------------------------------------------------------
   COLOCAR FLECHA EN EL PISO
------------------------------------------------------- */

function colocarFlecha() {

  if (!reticle.visible) return;

  if (flecha) {
    scene.remove(flecha);
  }

  flecha = crearFlecha();

  /*
    Copiamos la posición y orientación espacial
    detectadas por WebXR.
  */

  flecha.position.setFromMatrixPosition(reticle.matrix);
  flecha.quaternion.setFromRotationMatrix(reticle.matrix);

  scene.add(flecha);

  estado.textContent =
    'Flecha colocada. Ahora caminá unos metros.';

  ayuda.textContent =
    'IMPORTANTE: no apuntes nuevamente al lugar de la flecha. Caminá y comprobá si permanece fija en el ambiente.';

  reset.style.display = 'block';
}

/* -------------------------------------------------------
   HIT TEST
------------------------------------------------------- */

function render(timestamp, frame) {

  if (frame) {

    const referenceSpace =
      renderer.xr.getReferenceSpace();

    const session =
      renderer.xr.getSession();

    if (!hitTestSourceRequested) {

      session.requestReferenceSpace('viewer')
        .then((referenceSpace) => {

          session.requestHitTestSource({
            space: referenceSpace
          }).then((source) => {
            hitTestSource = source;
          });

        });

      session.addEventListener(
        'end',
        () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
        }
      );

      hitTestSourceRequested = true;
    }

    if (hitTestSource) {

      const hitTestResults =
        frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {

        const hit = hitTestResults[0];

        const pose =
          hit.getPose(referenceSpace);

        reticle.visible = true;

        reticle.matrix.fromArray(
          pose.transform.matrix
        );

        if (!flecha) {
          estado.textContent =
            'Piso detectado. Tocá la pantalla para colocar la flecha.';
        }

      } else {

        reticle.visible = false;

        if (!flecha) {
          estado.textContent =
            'Buscando una superficie...';
        }
      }
    }
  }

  renderer.render(scene, camera);
}

function animate() {
  renderer.setAnimationLoop(render);
}

function onWindowResize() {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}
</script>

</body>
</html>
